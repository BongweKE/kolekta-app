name: Deploy Website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Gate: only deploy after CI passes on the same commit
  ci-passed:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow success on this commit
        uses: fountainhead/action-wait-for-check@v1.2.0
        id: wait-ci
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: frontend-checks
          ref: ${{ github.sha }}
          timeoutSeconds: 900
      - name: Fail if CI did not pass
        if: steps.wait-ci.outputs.conclusion != 'success' && steps.wait-ci.outputs.conclusion != 'skipped'
        run: |
          echo "CI did not pass for ${{ github.sha }} (conclusion: ${{ steps.wait-ci.outputs.conclusion }})"
          exit 1

  deploy:
    needs: ci-passed
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build project
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      - name: Deploy to Vercel (production)
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@latest
          # Only pass --build-env flags for values that are actually set;
          # empty ones would override the code's built-in defaults with blanks.
          ARGS=""
          if [ -n "$NEXT_PUBLIC_SANITY_PROJECT_ID" ]; then
            ARGS="$ARGS --build-env NEXT_PUBLIC_SANITY_PROJECT_ID=$NEXT_PUBLIC_SANITY_PROJECT_ID"
          fi
          if [ -n "$NEXT_PUBLIC_SANITY_DATASET" ]; then
            ARGS="$ARGS --build-env NEXT_PUBLIC_SANITY_DATASET=$NEXT_PUBLIC_SANITY_DATASET"
          fi
          if [ -n "$SANITY_API_READ_TOKEN" ]; then
            ARGS="$ARGS --build-env SANITY_API_READ_TOKEN=$SANITY_API_READ_TOKEN"
          fi
          if [ -n "$SANITY_API_WRITE_TOKEN" ]; then
            ARGS="$ARGS --build-env SANITY_API_WRITE_TOKEN=$SANITY_API_WRITE_TOKEN"
          fi
          vercel deploy --prod --yes $ARGS
      - name: Verify comments endpoint
        run: |
          sleep 20
          URL="${{ secrets.DEPLOY_URL }}"
          if [ -n "$URL" ]; then
            curl -fsS "$URL/api/comments?slug=kra-itax-guide" \
              || echo "WARN: could not reach comments endpoint — verify manually"
          else
            echo "DEPLOY_URL secret not set; skipping endpoint check"
          fi
